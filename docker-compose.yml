version: '3.8'

services:
  # Service Backend Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: campusfix-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=campusfix
      - DB_USERNAME=campus_user
      - DB_PASSWORD=secret_password
    depends_on:
      - mysql
    networks:
      - campusfix-network

  # Serveur Web Nginx
  nginx:
    image: nginx:alpine
    container_name: campusfix-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - campusfix-network

  # Base de données MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: campusfix-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campusfix
      MYSQL_USER: campus_user
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/dump/campusfix_database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - campusfix-network

  # Interface phpMyAdmin pour gestion facile lors de la démo
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: campusfix-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: campus_user
      PMA_PASSWORD: secret_password
    depends_on:
      - mysql
    networks:
      - campusfix-network

networks:
  campusfix-network:
    driver: bridge

volumes:
  db_data:
