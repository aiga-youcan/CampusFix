version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusfix-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - DB_CONNECTION=sqlite
    networks:
      - campusfix-network

networks:
  campusfix-network:
    driver: bridge